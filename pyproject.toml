[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "textflowkit"
version = "0.1.1"
description = "Cross-platform media transcription toolkit: URL or file in, timestamped transcripts and subtitle files out."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["transcription", "whisper", "subtitles", "srt", "vtt", "speech-to-text", "yt-dlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing",
]
dependencies = [
  "yt-dlp>=2025.1.1",
  "openai-whisper>=20240930",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "typing-extensions>=4.8; python_version < '3.11'", "pypdf>=5"]
mcp = ["mcp>=2.0"]
http = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7"]
# 4.x is required: 3.4.x imports torchaudio.AudioMetaData, which torchaudio 2.11
# no longer provides. See docs/install.md before installing - pyannote pulls
# torch open-endedly, so pin your torch stack or you lose GPU acceleration.
diarize = ["pyannote.audio>=4.0"]
export = ["python-docx>=1.1", "reportlab>=4.0"]
all = ["textflowkit[mcp,http,diarize,export]"]

[project.scripts]
textflowkit = "textflowkit.cli:main"
textflowkit-mcp = "textflowkit.adapters.mcp_server:main"
textflowkit-http = "textflowkit.adapters.http_server:main"

[project.urls]
Homepage = "https://github.com/scottconverse/textflowkit"
Issues = "https://github.com/scottconverse/textflowkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/textflowkit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"


