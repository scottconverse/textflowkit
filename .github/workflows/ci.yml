name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff>=0.6"
      - name: Ruff
        run: ruff check .

  test:
    # The product targets Windows natively (ROCm, no WSL), and is used from
    # Linux and macOS too. All three are exercised: Windows proves the platform
    # we primarily ship to, Linux and macOS prove the code is not accidentally
    # Windows-shaped. A single-OS matrix is not evidence for the others.
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install package with dev + adapter extras
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,http]"

      - name: Show ffmpeg version
        shell: bash
        run: ffmpeg -version | head -n 1

      - name: Run tests
        shell: bash
        run: python -m pytest -q

  installed-wheel:
    name: installed wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build wheel
        shell: bash
        run: |
          python -m pip install "setuptools>=83" "build>=1.2"
          python -m build --wheel
      - name: Smoke all three installed entry points
        shell: bash
        run: python scripts/smoke_installed_wheel.py dist/*.whl
