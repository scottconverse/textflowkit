name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff>=0.6"
      - name: Ruff
        run: ruff check .

  test:
    # The product targets Windows (native, no WSL) and also has to work on
    # Linux/macOS. Test both: Linux proves portability, Windows proves the
    # platform we actually ship to. A Linux-only matrix would not be evidence
    # for the Windows claim.
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Install package with dev + adapter extras
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,http]"

      - name: Show ffmpeg version
        shell: bash
        run: ffmpeg -version | head -n 1

      - name: Run tests
        shell: bash
        run: python -m pytest -q
