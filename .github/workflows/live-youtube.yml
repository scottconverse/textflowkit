name: Live YouTube transcription smoke

# Network/site/model drift makes this unsuitable for deterministic PR CI.
# Run it manually before cutting a release and keep its JSON receipt.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: python -m pip install -e .
      - name: Run public live URL through the CLI
        run: python scripts/smoke_live_youtube.py --receipt live-youtube-receipt.json
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-youtube-receipt
          path: live-youtube-receipt.json
          if-no-files-found: ignore
