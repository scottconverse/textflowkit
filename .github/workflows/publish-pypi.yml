name: Publish PyPI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'scottconverse/textflowkit'
    runs-on: ubuntu-latest
    # Actions read is needed to verify that this exact commit passed main CI.
    # It is granted to this job only: no upload job can read run results.
    permissions:
      contents: read
      actions: read
    outputs:
      # The upload jobs act on this: only a new fonts version may be uploaded.
      fonts_mode: ${{ steps.fonts_release.outputs.fonts_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - name: Verify release tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/verify_release_versions.py
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo 'Release tag is not merged into main' >&2
            exit 1
          }
      # A distribution's long description is built from the README at this commit
      # and frozen on upload, so a README that still names an older tag publishes
      # a permanently wrong version claim - the v0.1.5 mistake. This runs before
      # anything is built or uploaded.
      - name: Require the README to name the release being published
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/verify_readme_release.py
      - name: Require successful CI for this exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_release_ci.py
      # The fonts package is versioned on its own contract: when the version this
      # commit declares is already on PyPI, the release reuses those published
      # files instead of rebuilding them, and the fonts upload job is skipped.
      # The script decides, downloads and verifies, and stops the release on
      # anything it cannot verify. It runs before the build so a reuse can never
      # be overwritten by a local build, and before any upload.
      - name: Resolve the fonts release
        id: fonts_release
        run: |
          python scripts/fetch_published_fonts.py \
            --package-dir packages/textflowkit-fonts \
            --out-dir dist/fonts \
            --github-output "$GITHUB_OUTPUT"
      - name: Build distributions
        env:
          FONTS_MODE: ${{ steps.fonts_release.outputs.fonts_mode }}
        run: |
          python -m pip install --upgrade build packaging
          python -m build --sdist --wheel --outdir dist/main .
          case "$FONTS_MODE" in
            new)
              # The declared fonts version is not on PyPI, so this release
              # publishes it.
              python -m build --sdist --wheel --outdir dist/fonts packages/textflowkit-fonts
              ;;
            reuse)
              # dist/fonts holds the published files, fetched and verified
              # against PyPI above. Rebuilding here would replace them with
              # different bytes and break the hashes the manifest publishes.
              echo "reusing the textflowkit-fonts files fetched from PyPI"
              ;;
            *)
              echo "no fonts mode was resolved; refusing to build" >&2
              exit 1
              ;;
          esac
          python -m pip install twine
          python -m twine check dist/main/* dist/fonts/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish-fonts:
    needs: build
    # Only a new fonts version is uploaded. A reused one is already on PyPI, and
    # PyPI rejects a duplicate filename; this workflow deliberately does not
    # skip such an upload, so the job must not run at all.
    if: needs.build.outputs.fonts_mode == 'new'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/fonts/

  publish-main:
    # The core upload needs the build as well as the fonts job. On a reuse the
    # fonts job is *skipped*, and GitHub skips a job whose `needs:` job was
    # skipped unless the job's `if` uses a status check function - `cancelled()`
    # below. That is why the condition is written out instead of left implicit:
    # an implicit `success()` would lose to the skip propagation and the reuse
    # path would upload nothing and publish no release.
    #
    # `always()` would also defeat the skip propagation, but it runs the job in
    # a cancelled run too, so it is not used.
    #
    # Core may continue past the fonts job only when that job uploaded a new
    # fonts version or was skipped because the release reuses published files. A
    # failed or cancelled fonts upload, a failed build, a cancelled run, and a
    # skipped fonts job that was not a reuse all leave core unpublished, so a
    # core release cannot advertise a fonts version that is not on PyPI.
    needs: [build, publish-fonts]
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && (needs.publish-fonts.result == 'success'
              || (needs.publish-fonts.result == 'skipped'
                  && needs.build.outputs.fonts_mode == 'reuse')) }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/main/

  publish-github-release:
    # Deliberately no `if:` here. The implicit `success()` plus the default skip
    # propagation is the gate that matters: a core upload that failed or was
    # skipped for any reason skips this job too, so a failed release cannot end
    # in a public GitHub release. Adding a status check function here would
    # weaken that, not strengthen it.
    needs: publish-main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The manifest step runs this repository's own script, so the tagged
      # commit must be present. Its bytes are the ones already required to have
      # passed CI on main, and `gh` takes the token from the environment, not
      # from git credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The manifest pins each project's own version. Core is the tag; fonts is
      # the version the tagged commit declares, which is the version of the
      # files in dist/fonts whether they were built or fetched.
      - name: Read the declared fonts version
        id: fonts_version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          project = tomllib.loads(
              Path('packages/textflowkit-fonts/pyproject.toml').read_text(encoding='utf-8')
          )['project']
          print(f"version={project['version']}")
          PY
      - name: Hash the downloaded distributions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          FONTS_VERSION: ${{ steps.fonts_version.outputs.version }}
        run: |
          python scripts/write_release_manifest.py \
            --output SHA256SUMS --version "$RELEASE_TAG" --fonts-version "$FONTS_VERSION" \
            dist/main/* dist/fonts/*
      - name: Create draft with the exact PyPI distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/main/* dist/fonts/* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$RELEASE_TAG" --generate-notes
      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
