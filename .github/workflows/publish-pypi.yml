name: Publish PyPI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'scottconverse/textflowkit'
    runs-on: ubuntu-latest
    # Actions read is needed to verify that this exact commit passed main CI.
    # It is granted to this job only: no upload job can read run results.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - name: Verify release tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          from packaging.version import Version

          tag = os.environ['RELEASE_TAG']
          if not tag.startswith('v'):
              raise SystemExit('Release tag must start with v')
          version = str(Version(tag[1:]))
          if tag != 'v' + version:
              raise SystemExit('Release tag is not a normalized final version')
          if Version(version).is_prerelease or Version(version).is_devrelease:
              raise SystemExit('PyPI release must be a final version')
          for file in (Path('pyproject.toml'), Path('packages/textflowkit-fonts/pyproject.toml')):
              declared = tomllib.loads(file.read_text(encoding='utf-8'))['project']['version']
              if declared != version:
                  raise SystemExit(f'{file}: {declared} != {version}')
          PY
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo 'Release tag is not merged into main' >&2
            exit 1
          }
      - name: Require successful CI for this exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_release_ci.py
      - name: Build distributions
        run: |
          python -m pip install --upgrade build packaging
          python -m build --sdist --wheel --outdir dist/main .
          python -m build --sdist --wheel --outdir dist/fonts packages/textflowkit-fonts
          python -m pip install twine
          python -m twine check dist/main/* dist/fonts/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish-fonts:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/fonts/

  publish-main:
    needs: publish-fonts
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/main/

  publish-github-release:
    needs: publish-main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The manifest step runs this repository's own script, so the tagged
      # commit must be present. Its bytes are the ones already required to have
      # passed CI on main, and `gh` takes the token from the environment, not
      # from git credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Hash the downloaded distributions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/write_release_manifest.py \
            --output SHA256SUMS --version "$RELEASE_TAG" dist/main/* dist/fonts/*
      - name: Create draft with the exact PyPI distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/main/* dist/fonts/* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$RELEASE_TAG" --generate-notes
      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
